name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    name: Dependency Audit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Scanning

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "ERROR: .env files should not be committed"
            exit 1
          fi
          echo "No committed .env files found."

      - name: Scan for high-signal secret patterns
        run: |
          # Patterns: private keys, tokens, passwords, API keys in tracked files
          PATTERNS=(
            'private[_-]?key\s*[:=]\s*["\x27][^"'\'']{8,}'
            'api[_-]?key\s*[:=]\s*["\x27][^"'\'']{8,}'
            'secret\s*[:=]\s*["\x27][^"'\'']{8,}'
            'password\s*[:=]\s*["\x27][^"'\'']{8,}'
            'AKIA[0-9A-Z]{16}'
            'ghp_[0-9A-Za-z]{36}'
            'glpat-[0-9A-Za-z\-]{20}'
            'sk-[A-Za-z0-9]{32,}'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -liE "$pattern" -- ':!node_modules' ':!*.lock' 2>/dev/null; then
              echo "WARNING: Possible secret matching pattern: $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "ERROR: Possible secrets detected — review files listed above."
            exit 1
          fi
          echo "Secret pattern scan passed."
